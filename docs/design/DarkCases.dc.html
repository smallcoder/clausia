<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>داكن · القضايا (كمبيوتر)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E17}
a{color:#EEF0F3;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#7D8492}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(900px 480px at 50% -10%, rgba(214,192,143,0.07), transparent 70%), #0B0F18; color: #EEF0F3; font-family: -apple-system, BlinkMacSystemFont, 'SF Arabic', 'SF Pro Text', system-ui, 'Vazirmatn', sans-serif">

  <header style="width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 40px; height: 72px; display: flex; align-items: center; gap: 10px; box-sizing: border-box">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px">
      <a href="DarkHome.dc.html" style="display: flex; align-items: center; gap: 10px">
        <div style="width: 30px; height: 30px; border-radius: 8px; background: {{accentGrad}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 16px {{accentShadow}}; color: #121A2B; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-weight: 900; font-size: 17px">C</div>
        <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Clausia</span>
      </a>
    </div>
    <a href="DarkRoll.dc.html" style="height: 38px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; color: #C3C8D0; font-size: 14px; background: #171D2B; border: 1px solid rgba(255,255,255,0.08)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>الجلسات</a>
    <a href="#" style="height: 38px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-size: 14px; font-weight: 600; background: #252D44; border: 1px solid rgba(255,255,255,0.12)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>القضايا</a>
    <div style="width: 38px; height: 38px; border-radius: 19px; background: #222A3D; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: 4px">أت</div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 16px 40px 0; box-sizing: border-box; display: flex; flex-direction: column">
    <section style="border-radius: 28px; padding: 22px 24px; background: #141C2E; border: 1px solid {{accentEdge}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 30px 60px -24px rgba(0,0,0,0.9); display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; align-items: center; gap: 16px">
        <a href="DarkHome.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        <div style="width: 60px; height: 60px; flex: 0 0 60px; border-radius: 19px; background: {{accentGrad}}; color: #121A2B; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 12px 28px {{accentShadow}}; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></div>
        <div style="min-width: 0">
          <div style="font-size: 12px; font-weight: 700; color: {{accent}}">مكتب الأستاذ تجريبي</div>
          <h1 style="margin: 2px 0 0; font-size: 30px; line-height: 1.25; font-weight: 800; color: #FFFFFF">القضايا</h1>
        </div>
      </div>
      <div style="flex: 0 1 470px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div style="border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; color: #FFFFFF; line-height: 1">12</div><div style="font-size: 11px; color: #B9C0CC; margin-top: 4px">قضية عندك</div></div>
          <div style="border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; color: #FFFFFF; line-height: 1">05</div><div style="font-size: 11px; color: #B9C0CC; margin-top: 4px">جلسات الأسبوع</div></div>
          <div style="border-radius: 16px; padding: 12px 14px; background: {{accentGrad}}; color: #121A2B; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">04</div><div style="font-size: 11px; font-weight: 600; margin-top: 4px">محتاجة قرار</div></div>
      </div>
    </section>

    <label style="display: flex; align-items: center; gap: 12px; height: 54px; margin-top: 16px; padding: 0 16px; border-radius: 18px; background: #171E2D; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 40px -20px rgba(0,0,0,0.7)">
      <div style="width: 26px; height: 26px; border-radius: 13px; background: {{accentGrad}}; color: #121A2B; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-weight: 900; font-size: 12px; box-shadow: 0 0 12px {{accentShadow}}">C</div>
      <input aria-label="ابحث أو اسأل Clausia" placeholder="ابحث باسم أو رقم، أو اسأل Clausia: إيه قضايا الإيجار اللي جلستها الشهر ده؟" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #EEF0F3">
      <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.14); color: #9BA2AE">⌘K</span>
    </label>

    <div style="display: flex; gap: 8px; margin-top: 14px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: 14px; border-radius: 22px; background: #141A27; border: 1px solid rgba(255,255,255,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 28px 60px -24px rgba(0,0,0,0.7); overflow: hidden">
      <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 16px; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px; font-weight: 600; color: #7D8492">
        <span>القضية</span><span>المحكمة</span><span>الجلسة الجاية</span><span>الحالة</span>
      </div>
      <sc-for list="{{cases}}" as="c" hint-placeholder-count="7">
        <a href="DarkCase.dc.html" style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 16px; align-items: center; padding: 12px 20px; border-bottom: {{c.line}}">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
            <div style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</div>
            <div style="min-width: 0">
              <div style="font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</div>
              <div style="font-size: 12px; color: #9BA2AE">{{c.number}}</div>
            </div>
          </div>
          <span style="font-size: 13px; color: #C3C8D0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.court}}</span>
          <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 13px; font-weight: 700; color: {{c.dateColor}}">{{c.next}}</span>
          <span style="justify-self: start; height: 24px; padding: 0 10px; border-radius: 12px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center">{{c.status}}</span>
        </a>
      </sc-for>
    </div>

    <div style="flex: 1; min-height: 24px"></div>

    <div style="position: sticky; bottom: 0; padding: 12px 0 28px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 820px">
        <div style="border-radius: 27px; padding: 1px; background: rgba(255,255,255,0.10); box-shadow: 0 30px 70px -24px rgba(0,0,0,0.8)">
          <div style="border-radius: 26px; background: #171E2D; padding: 8px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07)">
            <button aria-label="إرفاق ورقة" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.1); background: #1E2535; color: #D6D9DF; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input aria-label="قضية جديدة" placeholder="قضية جديدة؟ احكيها لـ Clausia، أو ارفع الصحيفة وهي تعمل الملف" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #EEF0F3">
            <button aria-label="إرسال" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{accentGrad}}; color: #121A2B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 8px 20px {{accentShadow}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#D6C08F","#C9D1D9","#BCD0C3","#D4FF3A"],"default":"#D6C08F"},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#D6C08F';
    var hex = accent.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var rgba = function (a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
    var mix = function (t, to) { return 'rgb(' + Math.round(r + (to - r) * t) + ',' + Math.round(g + (to - g) * t) + ',' + Math.round(b + (to - b) * t) + ')'; };
    var grad = 'linear-gradient(135deg, ' + mix(0.16, 255) + ' 0%, ' + accent + ' 45%, ' + mix(0.08, 40) + ' 100%)';
    var fl = ['الكل · 12', 'متداولة · 9', 'محجوزة للحكم · 2', 'منتهية · 1'];
    var st = { 'متداولة': ['rgba(110,231,170,0.12)', '#86EFB8'], 'محجوزة للحكم': [rgba(0.14), accent], 'محتاجة قرار': ['rgba(232,169,59,0.16)', '#F2C27A'] };
    var cs = [
      ['عن', 'عادل النموذجي — إخلاء لعدم سداد الأجرة', '772 لسنة 2025', 'شمال القاهرة الابتدائية', '5/11/2026', 'متداولة', true],
      ['كم', 'كريم المثالي — صحة ونفاذ عقد بيع', '8833 لسنة 2024', 'استئناف القاهرة', 'النهارده', 'متداولة', true],
      ['مف', 'منى الافتراضية — فصل تعسفي', '1290 لسنة 2025', 'الجيزة الابتدائية', 'النهارده', 'متداولة', true],
      ['شم', 'شركة المثال للتجارة — مديونية توريدات', '2207 لسنة 2025', 'الاقتصادية بالقاهرة', 'بكرة', 'متداولة', false],
      ['هف', 'هالة الافتراضية — نفقة زوجية', '315 لسنة 2025', 'أسرة مصر الجديدة', 'بكرة', 'متداولة', false],
      ['يم', 'ياسر النموذجي — فرز وتجنيب', '98 لسنة 2026', 'حلوان الجزئية', '—', 'محتاجة قرار', false],
      ['طا', 'طارق الاختباري — إلغاء قرار نقل', '6610 لسنة 2025', 'القضاء الإداري', '12/11/2026', 'محجوزة للحكم', false]
    ];
    return {
      accent: accent, accentWash: rgba(0.14), accentEdge: rgba(0.45), accentShadow: rgba(0.35), accentGlow: rgba(0.08), accentGrad: grad,
      filters: fl.map(function (l, i) { return { label: l, bg: i === 0 ? grad : '#171D2B', fg: i === 0 ? '#121A2B' : '#D6D9DF', border: i === 0 ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)' }; }),
      cases: cs.map(function (c, i) { return { initials: c[0], title: c[1], number: c[2], court: c[3], next: c[4], status: c[5], stBg: st[c[5]][0], stFg: st[c[5]][1], avBg: i === 0 ? accent : '#252C3D', avFg: i === 0 ? '#121A2B' : '#D1D5DB', dateColor: c[6] ? accent : '#C3C8D0', line: i < cs.length - 1 ? '1px solid rgba(255,255,255,0.05)' : '0' }; })
    };
  }
}
</script>
</body>
</html>
