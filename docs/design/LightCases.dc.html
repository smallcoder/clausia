<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فاتح · القضايا (كمبيوتر)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F8}
a{color:#121A2B;text-decoration:none}a:hover{color:#000000}
input::placeholder{color:#7A7E85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(180deg, #FFFFFF 0px, #F4F5F8 380px); color: #121A2B; font-family: -apple-system, BlinkMacSystemFont, 'SF Arabic', 'SF Pro Text', system-ui, 'Vazirmatn', sans-serif">

  <header style="width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 40px; height: 72px; display: flex; align-items: center; gap: 10px; box-sizing: border-box">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px">
      <a href="LightHome.dc.html" style="display: flex; align-items: center; gap: 10px">
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #141C2E; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-weight: 900; font-size: 17px; box-shadow: 0 4px 10px rgba(18,26,43,0.3)">C</div>
        <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Clausia</span>
      </a>
    </div>
    <a href="LightRoll.dc.html" style="height: 38px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; color: #3E4248; font-size: 14px; background: #FFFFFF; border: 1px solid rgba(18,26,43,0.08); box-shadow: 0 2px 6px rgba(18,26,43,0.06)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>الجلسات</a>
    <a href="#" style="height: 38px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-size: 14px; font-weight: 600; background: #141C2E; box-shadow: 0 6px 14px rgba(18,26,43,0.3)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>القضايا</a>
    <div style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; border: 1px solid rgba(18,26,43,0.08); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: 4px">أت</div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 16px 40px 0; box-sizing: border-box; display: flex; flex-direction: column">
    <section style="border-radius: 28px; padding: 22px 24px; background: #FFFFFF; border: 1px solid rgba(18,26,43,0.07); box-shadow: 0 1px 2px rgba(18,26,43,0.05), 0 22px 46px -24px rgba(18,26,43,0.25); display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; align-items: center; gap: 16px">
        <a href="LightHome.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: #F1F3F6; border: 1px solid rgba(18,26,43,0.08); color: #121A2B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        <div style="width: 60px; height: 60px; flex: 0 0 60px; border-radius: 19px; background: #141C2E; color: {{accent}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 26px -10px rgba(18,26,43,0.55); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></div>
        <div style="min-width: 0">
          <div style="font-size: 12px; font-weight: 700; color: #7A5E24">مكتب الأستاذ تجريبي</div>
          <h1 style="margin: 2px 0 0; font-size: 30px; line-height: 1.25; font-weight: 800; color: #121A2B">القضايا</h1>
        </div>
      </div>
      <div style="flex: 0 1 470px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div style="border-radius: 16px; padding: 12px 14px; background: #F4F6F9; border: 1px solid rgba(18,26,43,0.06)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; color: #121A2B; line-height: 1">12</div><div style="font-size: 11px; color: #5F636A; margin-top: 4px">قضية عندك</div></div>
          <div style="border-radius: 16px; padding: 12px 14px; background: #F4F6F9; border: 1px solid rgba(18,26,43,0.06)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; color: #121A2B; line-height: 1">05</div><div style="font-size: 11px; color: #5F636A; margin-top: 4px">جلسات الأسبوع</div></div>
          <div style="border-radius: 16px; padding: 12px 14px; background: #141C2E; color: {{accent}}; box-shadow: 0 10px 22px -10px rgba(18,26,43,0.5)"><div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">04</div><div style="font-size: 11px; font-weight: 600; margin-top: 4px">محتاجة قرار</div></div>
      </div>
    </section>

    <label style="display: flex; align-items: center; gap: 12px; height: 54px; margin-top: 16px; padding: 0 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(18,26,43,0.08); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 4px {{accentRing}}, 0 18px 40px -20px rgba(18,26,43,0.3)">
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #141C2E; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-weight: 900; font-size: 12px; box-shadow: 0 4px 10px rgba(18,26,43,0.3)">C</div>
      <input aria-label="ابحث أو اسأل Clausia" placeholder="ابحث باسم أو رقم، أو اسأل Clausia: إيه قضايا الإيجار اللي جلستها الشهر ده؟" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #121A2B">
      <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(18,26,43,0.14); color: #5F636A">⌘K</span>
    </label>

    <div style="display: flex; gap: 8px; margin-top: 14px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600; box-shadow: {{f.shadow}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(18,26,43,0.07); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(18,26,43,0.05), 0 28px 56px -24px rgba(18,26,43,0.25); overflow: hidden">
      <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 16px; padding: 12px 20px; border-bottom: 1px solid rgba(18,26,43,0.06); font-size: 12px; font-weight: 600; color: #6B6F76; background: linear-gradient(180deg, {{accentTint}}, rgba(255,255,255,0))">
        <span>القضية</span><span>المحكمة</span><span>الجلسة الجاية</span><span>الحالة</span>
      </div>
      <sc-for list="{{cases}}" as="c" hint-placeholder-count="7">
        <a href="LightCase.dc.html" style="display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 16px; align-items: center; padding: 12px 20px; border-bottom: {{c.line}}">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
            <div style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</div>
            <div style="min-width: 0">
              <div style="font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</div>
              <div style="font-size: 12px; color: #5F636A">{{c.number}}</div>
            </div>
          </div>
          <span style="font-size: 13px; color: #3E4248; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.court}}</span>
          <span style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 13px; font-weight: 700; color: {{c.dateColor}}">{{c.next}}</span>
          <span style="justify-self: start; height: 24px; padding: 0 10px; border-radius: 12px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center">{{c.status}}</span>
        </a>
      </sc-for>
    </div>

    <div style="flex: 1; min-height: 24px"></div>

    <div style="position: sticky; bottom: 0; padding: 12px 0 28px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 820px">
        <div style="border-radius: 26px; background: #FFFFFF; padding: 8px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(18,26,43,0.08); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 4px {{accentRing}}, 0 30px 60px -24px rgba(18,26,43,0.35)">
          <button aria-label="إرفاق ورقة" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(18,26,43,0.08); background: #F1F3F6; color: #2A2D31; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input aria-label="قضية جديدة" placeholder="قضية جديدة؟ احكيها لـ Clausia، أو ارفع الصحيفة وهي تعمل الملف" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #121A2B">
          <button aria-label="إرسال" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #141C2E; color: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 18px rgba(18,26,43,0.35)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#D6C08F","#C9D1D9","#BCD0C3","#D4FF3A"],"default":"#D6C08F"},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#D6C08F';
    var hex = accent.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var rgba = function (a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
    var ink = '#141C2E';
    var fl = ['الكل · 12', 'متداولة · 9', 'محجوزة للحكم · 2', 'منتهية · 1'];
    var st = { 'متداولة': ['#E3F2E8', '#17663A'], 'محجوزة للحكم': [rgba(0.3), '#5E4718'], 'محتاجة قرار': ['#FBEBD0', '#8A5300'] };
    var cs = [
      ['عن', 'عادل النموذجي — إخلاء لعدم سداد الأجرة', '772 لسنة 2025', 'شمال القاهرة الابتدائية', '5/11/2026', 'متداولة', true],
      ['كم', 'كريم المثالي — صحة ونفاذ عقد بيع', '8833 لسنة 2024', 'استئناف القاهرة', 'النهارده', 'متداولة', true],
      ['مف', 'منى الافتراضية — فصل تعسفي', '1290 لسنة 2025', 'الجيزة الابتدائية', 'النهارده', 'متداولة', true],
      ['شم', 'شركة المثال للتجارة — مديونية توريدات', '2207 لسنة 2025', 'الاقتصادية بالقاهرة', 'بكرة', 'متداولة', false],
      ['هف', 'هالة الافتراضية — نفقة زوجية', '315 لسنة 2025', 'أسرة مصر الجديدة', 'بكرة', 'متداولة', false],
      ['يم', 'ياسر النموذجي — فرز وتجنيب', '98 لسنة 2026', 'حلوان الجزئية', '—', 'محتاجة قرار', false],
      ['طا', 'طارق الاختباري — إلغاء قرار نقل', '6610 لسنة 2025', 'القضاء الإداري', '12/11/2026', 'محجوزة للحكم', false]
    ];
    return {
      accent: accent, accentWash: rgba(0.28), accentRing: rgba(0.22), accentTint: rgba(0.16),
      filters: fl.map(function (l, i) { return { label: l, bg: i === 0 ? ink : '#FFFFFF', fg: i === 0 ? accent : '#2A2D31', border: i === 0 ? 'rgba(18,26,43,0.4)' : 'rgba(18,26,43,0.08)', shadow: i === 0 ? '0 6px 14px rgba(18,26,43,0.3)' : '0 2px 6px rgba(18,26,43,0.06)' }; }),
      cases: cs.map(function (c, i) { return { initials: c[0], title: c[1], number: c[2], court: c[3], next: c[4], status: c[5], stBg: st[c[5]][0], stFg: st[c[5]][1], avBg: i === 0 ? '#121A2B' : '#ECEFF3', avFg: i === 0 ? accent : '#3E4248', dateColor: c[6] ? '#7A5E24' : '#3E4248', line: i < cs.length - 1 ? '1px solid rgba(18,26,43,0.05)' : '0' }; })
    };
  }
}
</script>
</body>
</html>
