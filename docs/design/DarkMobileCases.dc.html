<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>داكن · القضايا (موبايل)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#EEF0F3;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#7D8492}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: radial-gradient(900px 480px at 50% -10%, rgba(214,192,143,0.07), transparent 70%), #0B0F18; color: #EEF0F3; font-family: -apple-system, BlinkMacSystemFont, 'SF Arabic', 'SF Pro Text', system-ui, 'Vazirmatn', sans-serif">

  <div style="padding: 10px 10px 0">
    <section style="position: relative; border-radius: 30px; padding: 12px 14px 18px; overflow: hidden; background: #141C2E; border: 1px solid {{accentEdge}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 30px 60px -24px rgba(0,0,0,0.9)">
      <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
        <a href="DarkMobileHome.dc.html" aria-label="رجوع" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <div style="display: flex; gap: 8px">
          <button aria-label="ترتيب" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          </button>
        </div>
      </div>
      <div style="position: relative; display: flex; align-items: center; gap: 14px; margin-top: 16px">
        <div style="width: 54px; height: 54px; flex: 0 0 54px; border-radius: 17px; background: {{accentGrad}}; color: #121A2B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 12px 28px {{accentShadow}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: {{accent}}">مكتب الأستاذ تجريبي</div>
          <h1 style="margin: 2px 0 0; font-size: 28px; line-height: 1.15; font-weight: 800; color: #FFFFFF">القضايا</h1>
        </div>
      </div>
      <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
        <div style="border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)">
          <div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 24px; font-weight: 800; color: #FFFFFF; line-height: 1">12</div>
          <div style="font-size: 11px; color: #B9C0CC; margin-top: 4px">قضية عندك</div>
        </div>
        <div style="border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)">
          <div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 24px; font-weight: 800; color: #FFFFFF; line-height: 1">05</div>
          <div style="font-size: 11px; color: #B9C0CC; margin-top: 4px">جلسات الأسبوع</div>
        </div>
        <div style="border-radius: 16px; padding: 10px 12px; background: {{accentGrad}}; color: #121A2B; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)">
          <div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 24px; font-weight: 800; line-height: 1">04</div>
          <div style="font-size: 11px; font-weight: 600; margin-top: 4px">محتاجة قرار</div>
        </div>
      </div>
    </section>
  </div>

  <div style="padding: 0 16px 200px">

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; margin-top: 12px; padding: 0 14px; border-radius: 16px; background: #171E2D; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05)">
      <div style="width: 22px; height: 22px; border-radius: 11px; background: {{accentGrad}}; color: #121A2B; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-weight: 900; font-size: 11px">C</div>
      <input aria-label="ابحث أو اسأل Clausia" placeholder="ابحث، أو اسأل: قضايا الإيجار المحجوزة للحكم؟" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: #EEF0F3">
    </label>

    <div style="display: flex; gap: 6px; margin-top: 12px; overflow: hidden">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button style="flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 12.5px; font-weight: 600">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: 14px; border-radius: 20px; background: #141A27; border: 1px solid rgba(255,255,255,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 36px -18px rgba(0,0,0,0.7); padding: 2px 14px">
      <sc-for list="{{cases}}" as="c" hint-placeholder-count="7">
        <a href="DarkMobileCase.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: {{c.line}}">
          <div style="width: 38px; height: 38px; flex: 0 0 38px; border-radius: 19px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{c.initials}}</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</div>
            <div style="font-size: 11.5px; color: #9BA2AE; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.meta}}</div>
          </div>
          <div style="text-align: left; flex: 0 0 auto">
            <div style="font-family: -apple-system, 'SF Pro Display', system-ui, 'Inter', sans-serif; font-size: 12px; font-weight: 700; color: {{c.dateColor}}">{{c.next}}</div>
            <div style="font-size: 10px; color: #7D8492; margin-top: 1px">{{c.status}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px 26px">
    <div style="border-radius: 27px; padding: 1px; background: rgba(255,255,255,0.10); box-shadow: 0 -10px 40px rgba(0,0,0,0.55)">
      <div style="border-radius: 26px; background: #171E2D; padding: 8px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07)">
        <button aria-label="إرفاق ورقة" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: #1E2535; color: #D6D9DF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input aria-label="قضية جديدة" placeholder="قضية جديدة؟ احكيها لـ Clausia، أو ارفع الصحيفة" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; font: inherit; font-size: 14.5px; color: #EEF0F3">
        <button aria-label="إرسال" style="width: 42px; height: 42px; border-radius: 21px; border: 0; background: {{accentGrad}}; color: #121A2B; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 8px 20px {{accentShadow}}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#D6C08F","#C9D1D9","#BCD0C3","#D4FF3A"],"default":"#D6C08F"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#D6C08F';
    var hex = accent.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    var rgba = function (a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
    var mix = function (t, to) { return 'rgb(' + Math.round(r + (to - r) * t) + ',' + Math.round(g + (to - g) * t) + ',' + Math.round(b + (to - b) * t) + ')'; };
    var grad = 'linear-gradient(135deg, ' + mix(0.16, 255) + ' 0%, ' + accent + ' 45%, ' + mix(0.08, 40) + ' 100%)';
    var fl = ['الكل · 12', 'متداولة · 9', 'محجوزة للحكم · 2', 'منتهية · 1'];
    var cs = [
      ['عن', 'عادل النموذجي — إخلاء لعدم سداد الأجرة', 'شمال القاهرة · 772/2025', '5/11', 'متداولة', true],
      ['كم', 'كريم المثالي — صحة ونفاذ عقد بيع', 'استئناف القاهرة · 8833/2024', 'النهارده', 'متداولة', true],
      ['مف', 'منى الافتراضية — فصل تعسفي', 'الجيزة الابتدائية · 1290/2025', 'النهارده', 'متداولة', true],
      ['شم', 'شركة المثال للتجارة — مديونية', 'الاقتصادية · 2207/2025', 'بكرة', 'متداولة', false],
      ['هف', 'هالة الافتراضية — نفقة زوجية', 'أسرة مصر الجديدة · 315/2025', 'بكرة', 'متداولة', false],
      ['يم', 'ياسر النموذجي — فرز وتجنيب', 'حلوان الجزئية · 98/2026', 'محتاجة قرار', 'متداولة', true],
      ['طا', 'طارق الاختباري — إلغاء قرار نقل', 'القضاء الإداري · 6610/2025', '12/11', 'محجوزة للحكم', false]
    ];
    return {
      accent: accent, accentWash: rgba(0.14), accentHalo: rgba(0.32), accentEdge: rgba(0.45), accentShadow: rgba(0.35), accentGlow: rgba(0.10), accentGrad: grad,
      filters: fl.map(function (l, i) { return { label: l, bg: i === 0 ? grad : '#171D2B', fg: i === 0 ? '#121A2B' : '#D6D9DF', border: i === 0 ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)' }; }),
      cases: cs.map(function (c, i) { return { initials: c[0], title: c[1], meta: c[2], next: c[3], status: c[4], avBg: i === 0 ? accent : '#252C3D', avFg: i === 0 ? '#121A2B' : '#D1D5DB', dateColor: c[5] ? accent : '#C3C8D0', line: i < cs.length - 1 ? '1px solid rgba(255,255,255,0.06)' : '0' }; })
    };
  }
}
</script>
</body>
</html>
